<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Gallery-Bondhus gameplay flow</title>
  <desc id="desc">Diagram showing setup, deck creation, gameplay, and scoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b041a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800">How a round works</text>
  <text x="70" y="105" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">The app stays useful offline; Gemini generation is an optional path, not a requirement.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(70 165)">
      <rect width="230" height="200" rx="22" fill="#12082b" stroke="#ec4899" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="19" fill="#ec4899" fill-opacity="0.18"/>
      <text x="40" y="47" text-anchor="middle" fill="#f9a8d4" font-size="18" font-weight="800">1</text>
      <text x="28" y="88" fill="#f8fafc" font-size="22" font-weight="800">Set up</text>
      <text x="28" y="121" fill="#cbd5e1" font-size="15">Choose 60 / 90 / 120 sec,</text>
      <text x="28" y="146" fill="#cbd5e1" font-size="15">pick categories, layout,</text>
      <text x="28" y="171" fill="#cbd5e1" font-size="15">and optional forehead mode.</text>
    </g>

    <g transform="translate(360 165)">
      <rect width="230" height="200" rx="22" fill="#12082b" stroke="#a855f7" stroke-opacity="0.48"/>
      <circle cx="40" cy="40" r="19" fill="#a855f7" fill-opacity="0.18"/>
      <text x="40" y="47" text-anchor="middle" fill="#d8b4fe" font-size="18" font-weight="800">2</text>
      <text x="28" y="88" fill="#f8fafc" font-size="22" font-weight="800">Build a deck</text>
      <text x="28" y="121" fill="#cbd5e1" font-size="15">Use the bundled local cards</text>
      <text x="28" y="146" fill="#cbd5e1" font-size="15">or ask Gemini for a fresh</text>
      <text x="28" y="171" fill="#cbd5e1" font-size="15">deduplicated set.</text>
    </g>

    <g transform="translate(650 165)">
      <rect width="230" height="200" rx="22" fill="#12082b" stroke="#22d3ee" stroke-opacity="0.48"/>
      <circle cx="40" cy="40" r="19" fill="#22d3ee" fill-opacity="0.15"/>
      <text x="40" y="47" text-anchor="middle" fill="#67e8f9" font-size="18" font-weight="800">3</text>
      <text x="28" y="88" fill="#f8fafc" font-size="22" font-weight="800">Play</text>
      <text x="28" y="121" fill="#cbd5e1" font-size="15">Friends act and give clues.</text>
      <text x="28" y="146" fill="#cbd5e1" font-size="15">Tap left to skip and right</text>
      <text x="28" y="171" fill="#cbd5e1" font-size="15">for a correct guess.</text>
    </g>

    <g transform="translate(940 165)">
      <rect width="190" height="200" rx="22" fill="#12082b" stroke="url(#accent)" stroke-opacity="0.55"/>
      <circle cx="40" cy="40" r="19" fill="#34d399" fill-opacity="0.16"/>
      <text x="40" y="47" text-anchor="middle" fill="#6ee7b7" font-size="18" font-weight="800">4</text>
      <text x="28" y="88" fill="#f8fafc" font-size="22" font-weight="800">Score</text>
      <text x="28" y="121" fill="#cbd5e1" font-size="15">Review correct / skipped</text>
      <text x="28" y="146" fill="#cbd5e1" font-size="15">cards and save a local</text>
      <text x="28" y="171" fill="#cbd5e1" font-size="15">leaderboard entry.</text>
    </g>
  </g>

  <path d="M307 265 H347" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M597 265 H637" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M887 265 H927" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="405" width="1060" height="1" fill="url(#accent)" opacity="0.35"/>
  <text x="70" y="447" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">React 19 · TypeScript · Vite · Express · localStorage · optional Gemini API</text>
</svg>
