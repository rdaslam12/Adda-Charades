<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Gallery-Bondhus Charades</title>
  <desc id="desc">A neon-styled banner for the Gallery-Bondhus mobile charades game.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090314"/>
      <stop offset="0.55" stop-color="#12082b"/>
      <stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="30" fill="url(#bg)"/>
  <circle cx="165" cy="130" r="125" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1040" cy="330" r="150" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>
  <rect x="54" y="54" width="1092" height="352" rx="24" fill="none" stroke="url(#neon)" stroke-opacity="0.28"/>

  <g transform="translate(96 95)">
    <circle cx="58" cy="58" r="54" fill="#12082b" stroke="url(#neon)" stroke-width="3"/>
    <path d="M58 29c-16 0-29 13-29 29 0 25-13 33-13 33h84s-13-8-13-33c0-16-13-29-29-29z" fill="none" stroke="url(#neon)" stroke-width="5" stroke-linecap="round"/>
    <path d="M49 99c5 9 13 9 18 0" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <path d="M19 18l8 8M97 18l-8 8M108 57h-12M20 57H8" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="250" y="145" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="5">A PHONE PARTY GAME</text>
  <text x="250" y="218" fill="url(#neon)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="900">GALLERY-BONDHUS</text>
  <text x="253" y="265" fill="#d1d5db" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="500">Bangla + English charades, made for playing with friends.</text>

  <g transform="translate(253 309)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">
    <rect x="0" y="0" width="171" height="43" rx="21" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-opacity="0.45"/>
    <text x="22" y="28" fill="#f9a8d4">Offline deck</text>
    <rect x="188" y="0" width="194" height="43" rx="21" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.45"/>
    <text x="210" y="28" fill="#d8b4fe">Optional AI deck</text>
    <rect x="399" y="0" width="183" height="43" rx="21" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="421" y="28" fill="#67e8f9">Touch controls</text>
  </g>

  <text x="1085" y="390" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">built for actual game nights</text>
</svg>
